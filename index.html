<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เครื่องคำนวณ BMI</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f7fc;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
    }

    .container {
        background: white;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        width: 350px;
    }

    h2 {
        text-align: center;
        color: #333;
    }

    .input-group {
        margin-bottom: 15px;
    }

    label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 8px;
        box-sizing: border-box;
    }

    button {
        width: 100%;
        padding: 12px;
        background: #0078d4;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
    }

    button:hover {
        background: #005fa3;
    }

    .result {
        margin-top: 20px;
        padding: 15px;
        border-radius: 8px;
        text-align: center;
        font-weight: bold;
    }

    .normal { background: #d4edda; color: #155724; }
    .warning { background: #fff3cd; color: #856404; }
    .danger { background: #f8d7da; color: #721c24; }
</style>
</head>
<body>

<div class="container">
    <h2>คำนวณ BMI</h2>

    <div class="input-group">
        <label>น้ำหนัก (กก.)</label>
        <input type="number" id="weight" placeholder="เช่น 65">
    </div>

    <div class="input-group">
        <label>ส่วนสูง (ซม.)</label>
        <input type="number" id="height" placeholder="เช่น 170">
    </div>

    <button onclick="calculateBMI()">คำนวณ BMI</button>

    <div id="result"></div>
</div>

<script>
function calculateBMI() {
    const weight = parseFloat(document.getElementById('weight').value);
    const height = parseFloat(document.getElementById('height').value) / 100;

    const resultDiv = document.getElementById('result');

    if (!weight || !height) {
        resultDiv.innerHTML = "กรุณากรอกข้อมูลให้ครบ";
        resultDiv.className = "result danger";
        return;
    }

    const bmi = weight / (height * height);

    let status = "";
    let className = "";

    if (bmi < 18.5) {
        status = "น้ำหนักน้อย";
        className = "warning";
    } else if (bmi < 23) {
        status = "น้ำหนักปกติ";
        className = "normal";
    } else if (bmi < 25) {
        status = "น้ำหนักเกิน";
        className = "warning";
    } else if (bmi < 30) {
        status = "โรคอ้วนระดับ 1";
        className = "danger";
    } else {
        status = "โรคอ้วนระดับ 2";
        className = "danger";
    }

    resultDiv.className = "result " + className;
    resultDiv.innerHTML = `
        BMI ของคุณคือ <br>
        <h3>${bmi.toFixed(2)}</h3>
        ${status}
    `;
}
</script>

</body>
</html>
